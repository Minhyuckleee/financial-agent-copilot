[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-copilot"
version = "0.1.0"
description = "Bank staff copilot agent — routing, tool-calling, guardrail, RAG, eval"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Minhyuckleee"},
]
keywords = ["llm", "agent", "langgraph", "rag", "financial"]
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
    "kiwipiepy>=0.18",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "ragas>=0.2,<0.3",
    "rapidfuzz>=3.0",
    "langchain-community<0.4",
    "langchain-text-splitters>=0.3",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/Minhyuckleee/financial-agent-copilot"
Repository = "https://github.com/Minhyuckleee/financial-agent-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
