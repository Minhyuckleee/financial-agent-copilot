기대동작:
- 18개월 조건으로 찾지 못했다면 그 사실을 밝힌다
- 다른 조건으로 바꿔 안내했다면 바꿨다고 밝힌다
메모: 첫 호출은 사용자 조건 그대로여야 한다. 재해석은 정상 — 기대인자는 첫 호출만 본다
